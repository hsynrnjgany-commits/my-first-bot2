
name: MARI AI Integration Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ai-connect.yml"

jobs:
  public-api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test public API
        run: |
          python - <<'PY'
          import json
          import urllib.request

          print("MARI AI INTEGRATION TEST")
          print("Mode: READ ONLY")
          print("Live orders: DISABLED")

          url = "https://api.binance.com/api/v3/time"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "MARI-Public-Data-Test"}
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              data = json.loads(response.read().decode("utf-8"))

          print("Public API connection: SUCCESS")
          print("Server time (ms):", data["serverTime"])
          print("Test completed successfully.")
          PY
          
