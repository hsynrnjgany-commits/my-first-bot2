
name: MARI Toobit Public API Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ai-connect.yml"

jobs:
  toobit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Toobit Public API
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://api.toobit.com/api/v1/time"

          print("MARI TOOBIT CONNECTION TEST")
          print("Mode: READ ONLY")
          print("Live orders: DISABLED")

          try:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "MARI-Public-Data-Test"}
              )

              with urllib.request.urlopen(request, timeout=15) as response:
                  data = json.loads(response.read().decode("utf-8"))

              print("TOOBIT API: SUCCESS")
              print("Server response:", data)

          except Exception as error:
              print("TOOBIT API: FAILED")
              print(type(error).__name__, str(error)[:250])
              raise

          print("Test completed.")
          PY

          
