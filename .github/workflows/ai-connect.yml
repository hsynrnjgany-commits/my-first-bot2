name: AI Integration Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-check:
    name: Verify Integration Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run public data fetcher
        run: python src/data/fetch_public.py
