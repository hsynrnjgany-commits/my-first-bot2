name: Public Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-public-data:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run public data test
        run: python src/data/fetch_public.py
