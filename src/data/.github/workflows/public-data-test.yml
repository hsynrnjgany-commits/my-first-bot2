
name: Public Market Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-data-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test public market data
        run: python src/data/fetch_public.py

      
